[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentf"
version = "0.1.0"
description = "Open Task Force - Autonomous multi-agent orchestration platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Arjun Bajpai" },
]

dependencies = [
    "anthropic>=0.49.0",
    "pydantic>=2.0",
    "textual>=1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
opentf = "opentf.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
