[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentf"
version = "0.1.3"
description = "Open Task Force - Autonomous multi-agent orchestration platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Arjun Bajpai" },
]
keywords = ["ai", "agent", "coding", "cli", "terminal", "llm", "anthropic", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "textual>=1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/itscool2b/opentf"
Repository = "https://github.com/itscool2b/opentf"
Issues = "https://github.com/itscool2b/opentf/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
analysis = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "tree-sitter-javascript>=0.22",
    "networkx>=3.0",
]

[project.scripts]
opentf = "opentf.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
